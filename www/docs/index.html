<!DOCTYPE html>
<html lang="en" data-cwf="dark">
<head>
	<meta charset="UTF-8">
	<title>SLR Translator — Documentation</title>
	<link rel="stylesheet" href="docs.css">
	<script type="text/javascript" src="../js/childWindowFrame.js"></script>
</head>
<body>
	<div id="shell">
		<nav id="sidebar">
			<input type="text" id="searchBox" placeholder="Search documentation..." autocomplete="off" />
			<div id="searchResults" class="hidden"></div>
			<nav id="pageNav"></nav>
			<div id="zoomBar">
				<button type="button" id="zoomOut" title="Zoom out (Ctrl+-)">&#8722;</button>
				<span id="zoomLevel" title="Reset zoom (Ctrl+0)">100%</span>
				<button type="button" id="zoomIn" title="Zoom in (Ctrl+=)">+</button>
			</div>
		</nav>
		<main id="mainColumn">
			<div id="content"><p>Loading...</p></div>
			<div id="pager"></div>
		</main>
	</div>
    <script src="manifest.js"></script>
    <script src="../js/addonDocs.js"></script>
    <script>
    // Documentation pages shipped by addons (www/addons/*/package.json, "docs"
    // field), appended to the manifest before docs.js builds the sidebar. Needs
    // the Node context of the NW.js window; opened any other way (e.g. a plain
    // browser), the built-in pages simply stand alone.
    (function () {
        if (typeof window.addonDocs !== "function" || !Array.isArray(window.DOCS_MANIFEST)) return;
        try {
            var path = require("path"), fs = require("fs");
            var candidates = [];
            // The "www/..." module alias is registered by the main app (mixed
            // context); nw.App.startPath is the installation root as fallback.
            try { candidates.push(path.resolve(path.dirname(require.resolve("www/js/addonDocs.js")), "..", "addons")); } catch (e) {}
            try { candidates.push(path.join(nw.App.startPath, "www", "addons")); } catch (e) {}
            for (var i = 0; i < candidates.length; i++) {
                try {
                    if (fs.statSync(candidates[i]).isDirectory()) {
                        window.addonDocs(candidates[i]).forEach(function (section) {
                            window.DOCS_MANIFEST.push(section);
                        });
                        break;
                    }
                } catch (e) { /* try the next candidate */ }
            }
        } catch (e) { /* built-in docs only */ }
    })();
    </script>
    <script src="docs.js"></script>
<script>
// If the window that opened us is gone (the app quits by closing the main
// window and force-closing its registered children), close with it — this
// window must not keep the process alive on its own.
setInterval(function () {
    try {
        if ((!window.opener || window.opener.closed) && typeof nw !== "undefined" && nw.Window.get()) {
            nw.Window.get().close(true);
        }
    } catch (e) { /* nw torn down: the process is exiting anyway */ }
}, 2000);
</script>
</body>
</html>
